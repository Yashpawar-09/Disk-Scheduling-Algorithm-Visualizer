<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auth Forms</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background-image: url("assets/img/hero-bg.jpg");
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: rgb(172, 170, 170);
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      position: relative;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    form {
      display: none;
      flex-direction: column;
    }
    form.active {
      display: flex;
    }
    input {
      margin-bottom: 15px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
    #lol{
        padding: 10px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button {
      padding: 10px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .link {
      margin-top: 10px;
      text-align: center;
      color: #007bff;
      cursor: pointer;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div class="container">
    </form>
    <!-- Login Form -->
    <form id="loginForm" class="active">
        <b><u>Login first to use any visualization process</u></b>
      <h2>Login</h2>
      <input type="email" placeholder="Email" required>
      <input type="password" placeholder="Password" required>
      <button type="submit"><a href="clone-graphical.html">Login</a></button>
      <div class="link" onclick="showForm('createForm')">Create Account</div>
      <div class="link" onclick="showForm('forgotForm')">Forgot Password?</div>
    </form>

    <!-- Create Account Form -->
    <form id="createForm">
      <h2>Create Account</h2>
      <input type="text" placeholder="Full Name" required>
      <input type="email" placeholder="Email" required>
      <input type="password" placeholder="Password" required>
      <input type="password" placeholder="Confirm Password" required>
      <button type="submit"><a href="created.html">Create account</a></button>
      <div class="link" onclick="showForm('loginForm')">Already have an account? Login</div>
    </form>

    <!-- Forgot Password Form -->
    <form id="forgotForm">
      <h2>Forgot Password</h2>
      <input type="email" placeholder="Enter your email" required>
      <button type="submit">Reset Password</button>
      <div class="link" onclick="showForm('loginForm')">Back to Login</div>
    </form>
  </div>

  <script>
    function showForm(formId) {
      document.querySelectorAll("form").forEach(form => {
        form.classList.remove("active");
      });
      document.getElementById(formId).classList.add("active");
    }
  </script>
</body>
</html>
