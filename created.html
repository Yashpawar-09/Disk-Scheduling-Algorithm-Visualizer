<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Account Created</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-image: url("assets/img/hero-bg.jpg");
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .success-box {
      background: rgb(172,170, 170);
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }

    .checkmark-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #28a745;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      animation: pop 0.4s ease-out forwards;
    }

    .checkmark {
      color: #fff;
      font-size: 40px;
      line-height: 1;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 10px;
      color: #333;
    }

    p {
      color: #555;
      font-size: 16px;
      margin-bottom: 25px;
    }

    .btn {
      background: #007bff;
      color: #fff;
      padding: 10px 20px;
      text-decoration: none;
      font-size: 16px;
      border-radius: 6px;
      display: inline-block;
      transition: background 0.3s;
    }

    .btn:hover {
      background: #0056b3;
    }

    @keyframes pop {
      0% {
        transform: scale(0.6);
        opacity: 0;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="success-box">
    <div class="checkmark-circle">
      <div class="checkmark">✔</div>
    </div>
    <h1>Account Created Successfully!</h1>
    <p>Your account has been created. You can now log in to access your dashboard.</p>
    <a href="login.html" class="btn">Go to Login</a>
  </div>
</body>
</html>
